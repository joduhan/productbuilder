<h1>📖 타로 카드 78장 의미 백과사전</h1>
<p class="intro">라이더-웨이트 타로 덱 전체 78장의 이름과 타로 카드 의미(타로카드 뜻)를 한눈에 정리했습니다.</p>

<div id="encyclopediaContent"></div>

<div class="site-footer">
<a href="index.html">🔮 타로 리딩</a>
<a href="encyclopedia.html">📖 카드 백과사전</a>

<script>

function applyTheme(theme){
    document.documentElement.setAttribute("data-theme",theme);
    document.getElementById("themeToggle").textContent=theme==="dark" ? "☀️" : "🌙";
    localStorage.setItem("theme",theme);
}

function toggleTheme(){
    const current=document.documentElement.getAttribute("data-theme");
    applyTheme(current==="dark" ? "light" : "dark");
}

const savedTheme=localStorage.getItem("theme")
    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

applyTheme(savedTheme);

function wikimediaThumb(url,width){
    const match=url.match(/^https:\/\/upload\.wikimedia\.org\/wikipedia\/commons\/([0-9a-f])\/([0-9a-f]{2})\/(.+)$/);
    if(!match) return url;
    const [,a,b,filename]=match;
    return `https://upload.wikimedia.org/wikipedia/commons/thumb/${a}/${b}/${filename}/${width}px-${filename}`;
}

const suits=[
    {title:"메이저 아르카나 (22장)",cards:tarotDeck.slice(0,22)},
    {title:"완드 (14장)",cards:tarotDeck.slice(22,36)},
    {title:"컵 (14장)",cards:tarotDeck.slice(36,50)},
    {title:"소드 (14장)",cards:tarotDeck.slice(50,64)},
    {title:"펜타클 (14장)",cards:tarotDeck.slice(64,78)}
];

const content=document.getElementById("encyclopediaContent");

suits.forEach(suit=>{

    const section=document.createElement("div");
    section.className="suit-section";

    const title=document.createElement("div");
    title.className="suit-title";
    title.textContent=suit.title;
    section.appendChild(title);

    const grid=document.createElement("div");
    grid.className="card-grid";

    suit.cards.forEach(card=>{

        const cardEl=document.createElement("div");
        cardEl.className="enc-card";
        cardEl.id=tarotCardId(card);

        const img=document.createElement("img");
        img.src=wikimediaThumb(card.img,250);
        img.alt=card.name;
        img.loading="lazy";

        const name=document.createElement("div");
        name.className="enc-name";
        name.textContent=card.name;

        const meaning=document.createElement("div");
        meaning.className="enc-meaning";
        meaning.textContent=card.meaning;

        cardEl.appendChild(img);
        cardEl.appendChild(name);
        cardEl.appendChild(meaning);

        grid.appendChild(cardEl);

    });

    section.appendChild(grid);
    content.appendChild(section);

});

if(location.hash){
    const target=document.querySelector(location.hash);
    if(target) target.scrollIntoView({block:"center"});
}

const itemListLd={
    "@context":"https://schema.org",
    "@type":"ItemList",
    "name":"타로 카드 78장 목록",
    "itemListElement":tarotDeck.map((card,i)=>({
        "@type":"ListItem",
        "position":i+1,
        "name":card.name,
        "description":card.meaning
    }))
};

const ldScript=document.createElement("script");
ldScript.type="application/ld+json";
ldScript.textContent=JSON.stringify(itemListLd);
document.head.appendChild(ldScript);

</script>
